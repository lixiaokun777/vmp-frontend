server {
  # 容器内统一监听 80 端口，由宿主机负责端口映射。
  listen 80;
  server_name _;

  # 前端使用纯静态文件，不需要 Node.js 运行时。
  root /usr/share/nginx/html;
  index index.html;

  # API 请求转发到后端控制面，同源访问可避免额外的跨域配置。
  location /api/ {
    proxy_pass http://control-plane:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 当前 Nginx 是直接入口，覆盖客户端伪造的转发头，保证审计 IP 可信。
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # 未命中静态文件时回退到首页，支持后续引入前端路由。
  location / {
    try_files $uri $uri/ /index.html;

    # 当前前端无构建产物指纹，禁止浏览器长期缓存，避免 HTML 与脚本版本不一致。
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}
