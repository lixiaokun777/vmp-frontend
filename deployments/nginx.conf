map $http_upgrade $vmp_connection_upgrade {
  default upgrade;
  "" close;
}

# 不记录 query string，避免 WebSocket 短时票据出现在默认访问日志中。
log_format vmp_safe_access '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
  # 容器内统一监听 80 端口，由宿主机负责端口映射。
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log vmp_safe_access;

  # 前端使用纯静态文件，不需要 Node.js 运行时。
  root /usr/share/nginx/html;
  index index.html;

  # 脚本与控制台只允许同源；明确列出同一 Host 的 WebSocket 以兼容不同浏览器的 self 解析。
  # 第一方进度条及控制台库会设置动态样式，因此只对样式保留 unsafe-inline，不对脚本放宽。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # 缓存和安全头在同一层定义，避免 location 的 add_header 隐式取消父级安全头。
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;

  # API 请求转发到后端控制面，同源访问可避免额外的跨域配置。
  location /api/ {
    proxy_pass http://control-plane:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vmp_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_set_header X-Real-IP $remote_addr;
    # 当前 Nginx 是直接入口，覆盖客户端伪造的转发头，保证审计 IP 可信。
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # 未命中静态文件时回退到首页，支持后续引入前端路由。
  location / {
    try_files $uri $uri/ /index.html;

  }
}
