<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="研发临时虚拟机申领与生命周期管理平台" />
    <title>北斗云台</title>
    <link rel="stylesheet" href="/styles.css?v=20260930-10" />
    <link rel="stylesheet" href="/v1.css?v=20261003-12" />
  </head>
  <body>
    <div class="app-stage" id="app-shell" hidden>
      <div class="global-topbar">
        <div class="global-brand"><span>◇</span><b>北斗云台</b></div>
        <span class="global-product">研发临时服务器资源平台</span>
        <span class="global-provider">KVM 资源池</span>
      </div>
      <div class="shell">
      <aside>
        <div class="brand">
          <span>◇</span>
          <div><b>北斗云台</b><small>VM LEASE PLATFORM</small></div>
        </div>
        <nav>
          <button class="active" data-page="dashboard" data-admin>
            ◫ <span>资源总览</span>
          </button>
          <button data-page="apply">＋ <span>申请虚拟机</span></button>
          <button data-page="my-instances">▣ <span>我的虚拟机</span></button>
          <button data-page="requests">◷ <span>我的申请</span></button>
          <div class="nav-title" data-admin>平台管理</div>
          <button data-page="approvals" data-admin>✓ <span>待我审批</span></button>
          <button data-page="all-instances" data-admin>
            ▦ <span>全部实例</span>
          </button>
          <button data-page="hosts" data-admin>⌁ <span>宿主机</span></button>
          <button data-page="images" data-admin>◉ <span>镜像</span></button>
          <button data-page="flavors" data-admin>
            ▤ <span>资源规格</span>
          </button>
          <button data-page="network" data-admin>⌘ <span>网络 IP</span></button>
          <button data-page="users" data-admin>♙ <span>用户管理</span></button>
          <button data-page="ldap" data-admin>≡ <span>LDAP 配置</span></button>
          <button data-page="audit" data-admin>◎ <span>操作审计</span></button>
        </nav>
      </aside>
      <main>
        <header>
          <div>
            <small>北斗云台 /</small>
            <h1 id="page-title">资源总览</h1>
          </div>
          <div class="header-actions">
            <span id="api-state" class="pill">连接中</span>
            <div class="account-chip">
              <div class="avatar" id="user-avatar">--</div>
              <div>
                <b id="current-user">-</b><small id="current-role">-</small>
              </div>
            </div>
            <button class="btn mini" id="password-button">修改密码</button>
            <button class="btn mini" id="logout-button">退出登录</button>
          </div>
        </header>
        <section id="content"></section>
      </main>
      </div>
    </div>
    <div class="login-screen" id="login-screen">
      <div class="login-shell">
        <section class="login-hero">
          <div class="login-brand">
            <span>◇</span>
            <div><b>北斗云台</b><small>VM LEASE PLATFORM</small></div>
          </div>
          <div class="login-hero-copy">
            <span class="login-kicker">研发临时服务器资源平台</span>
            <h2>让每一台虚拟机<br />按需而生，到期而止</h2>
            <p>
              固定规格、自动交付、租期管理，为研发团队提供可控的虚拟机临时资源。
            </p>
            <div class="login-points">
              <span><i>✓</i> 租期到期自动回收</span>
              <span><i>✓</i> 用户与实例权限隔离</span>
              <span><i>✓</i> 平台账号与 LDAP 统一管理</span>
            </div>
          </div>
        </section>
        <form class="login-card" id="login-form">
          <div class="login-form-head">
            <span>统一身份入口</span>
            <h1>欢迎回来</h1>
            <p>请选择账号类型并登录北斗云台</p>
          </div>
          <div class="login-tabs" role="tablist" aria-label="登录方式">
            <button type="button" class="active" data-login-source="LOCAL">
              <b>平台账号</b><small>本地用户</small>
            </button>
            <button type="button" data-login-source="LDAP">
              <b>LDAP 账号</b><small>企业目录</small>
            </button>
          </div>
          <p class="login-description" id="login-description">
            使用管理员在平台中创建的账号登录。
          </p>
          <input type="hidden" name="source" value="LOCAL" />
          <label class="login-field"
            ><span>用户名</span
            ><input
              name="username"
              autocomplete="username"
              placeholder="请输入用户名"
              required
              autofocus
          /></label>
          <label class="login-field"
            ><span>密码</span
            ><input
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
          /></label>
          <div class="form-error" id="login-error"></div>
          <button class="login-submit" type="submit">
            <span>平台登录</span><b>→</b>
          </button>
          <small class="login-help"
            >无法登录？请联系平台管理员检查账号状态</small
          >
        </form>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast"></div>
    <script src="/app.js?v=20261003-13"></script>
  </body>
</html>
